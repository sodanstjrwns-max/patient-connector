<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필기 체험 · Patient Connect</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d68ca'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="/static/style.css"><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#d9e4f6;font-family:system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px 20px}header{margin-bottom:20px}h1{font-size:24px;letter-spacing:-.6px;margin:12px 0}p{color:#9dadc7;font-size:13px;line-height:1.8}a{color:#91b6ff;font-size:13px}figure{margin:0}.demo-note{padding:12px 16px;border:1px solid #334155;border-radius:8px;margin-top:20px;font-size:12px;color:#9dadc7}@media(max-width:640px){main{padding:18px 12px}h1{font-size:20px}}</style></head><body><main><header><a href="./">이미지 목업 목록으로</a><h1>설명 위에, 직접 그려보세요.</h1><p>펜·형광펜·지우개를 선택해 마우스, 터치 또는 펜으로 써보세요. 필기한 이미지는 PNG로 내려받을 수 있습니다.</p></header><section id="annotation-demo" aria-label="이미지 필기 체험"></section><aside class="demo-note">공개 목업 체험입니다. 여기서 작성한 필기는 병원 서버에 저장하거나 환자에게 발송하지 않습니다. 실제 병원 콘솔에서는 자료별 서버 저장 및 필기 포함 안내장 발급을 지원합니다. 원본 이미지는 바뀌지 않습니다.</aside></main><script src="/static/annotations.js"></script><script>const allowed=['implant','orthodontics','prosthetics','endodontics','caries','periodontal','pulp','cracked-tooth'];const requested=new URLSearchParams(location.search).get('file');const file=allowed.includes(requested)?requested:'implant';const root=document.getElementById('annotation-demo');root.innerHTML='<figure data-annotation-key="examples/'+file+'.png"><img src="'+file+'.png" alt="설명용 이미지 목업"></figure>';PCAnnotations.mount(root,{id:1},null,{demo:true});</script></body></html>
